[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchops-ai-copilot"
version = "0.1.0"
description = "ResearchOps AI Copilot — evidence-grounded protocol analysis for research administration (synthetic-data demo)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rebwar" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "httpx>=0.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "reportlab>=4.4",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "bandit>=1.7", "pip-audit"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]  # FastAPI File() dependency pattern
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "data"]
# B608: SQL identifiers are code-controlled constants/allow-listed fields, values bound
skips = ["B608"]
