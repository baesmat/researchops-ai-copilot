services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8410:8410"   # localhost-only by default
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8893/v1}
      LLM_MODEL: ${LLM_MODEL:-GLM-5.3-Flash-EXL3}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-240}
      APP_DB_PATH: /data/copilot.db
      APP_DATA_DIR: /data
    volumes:
      - copilot-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_BASE: http://api:8410
    depends_on:
      - api
    restart: unless-stopped

volumes:
  copilot-data:
